name: Release package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - ontophora
          - ontoplexis
          - ontopoiesis

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ inputs.package }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: packages/ontoplexis/.cache/robot
          key: robot-1.9.10
      - run: make sync
      - run: make check-${{ inputs.package }}
      - id: version
        run: printf 'version=%s\n' "$(date -u +%Y.%-m.%-d)" >> "$GITHUB_OUTPUT"
      - env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: uv version --frozen --package "$PACKAGE" "$VERSION"
      - run: uv build --package "${{ inputs.package }}" --out-dir dist --clear
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}-dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-${{ needs.build.outputs.package }}
      url: https://pypi.org/p/${{ needs.build.outputs.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.package }}-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.package }}-dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.package }}-v${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
