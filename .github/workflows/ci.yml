name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: packages/ontoplexis/.cache/robot
          key: robot-1.9.10
      # Memoized oracle conversions (see ontoplexis tests/oracle.py). Entries
      # are keyed by request content and jar digest, so a stale restore is
      # only ever unused bytes — the hashFiles key just bounds cache churn.
      - uses: actions/cache@v4
        with:
          path: packages/ontoplexis/.cache/oracle
          key: oracle-robot-1.9.10-${{ hashFiles('packages/ontoplexis/src/**', 'packages/ontoplexis/tests/fixtures/**', 'packages/ontophora/tests/fixtures/cases/*.xml') }}
          restore-keys: oracle-robot-1.9.10-
      - run: make sync
      - run: make check

  docs:
    # Pushes to main build (and deploy) docs via the Documentation workflow;
    # this job only validates docs on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: make sync
      - run: make docs
