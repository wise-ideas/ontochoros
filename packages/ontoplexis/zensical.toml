[project]
site_name = "Ontoplexis"
site_description = "Query OWL 2 ontologies with Cypher"
site_url = "https://wise-ideas.github.io/ontotheke/ontoplexis/"
repo_url = "https://github.com/wise-ideas/ontotheke/tree/main/packages/ontoplexis"
docs_dir = "docs"

nav = [
  { "Getting Started" = [
    { "Introduction" = "index.md" },
    { "Quickstart" = "quickstart.md" },
  ]},
  { "Concepts" = [
    { "The Design" = "concepts/design.md" },
    { "The Graph Schema" = "concepts/schema.md" },
  ]},
  { "How-to Guides" = [
    { "Query a Projection" = "howto/query.md" },
    { "Author with Cypher" = "howto/author.md" },
    { "Work with Other Formats" = "howto/documents.md" },
  ]},
  { "Reference" = [
    { "Public API" = "reference/api.md" },
    { "Edge Roles" = "reference/roles.md" },
  ]},
  { "Contributing" = [
    { "Development Setup" = "contrib/setup.md" },
  ]},
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
