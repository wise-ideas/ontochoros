[project]
site_name = "Ontopoiesis"
site_description = "OWL 2 ontology developer toolchain"
site_url = "https://wise-ideas.github.io/ontotheke/ontopoiesis/"
repo_url = "https://github.com/wise-ideas/ontotheke/tree/main/packages/ontopoiesis"
docs_dir = "docs"

nav = [
  { "Getting Started" = [
    { "Introduction" = "index.md" },
    { "Why Ontopoiesis" = "why.md" },
    { "Installation" = "installation.md" },
    { "Quickstart" = "quickstart.md" },
  ]},
  { "How-to Guides" = [
    { "CI" = "ci.md" },
    { "Diff" = "diff.md" },
    { "Impact" = "impact.md" },
    { "Migrations" = "migrations.md" },
    { "Rendering" = "rendering.md" },
    { "Lint" = "lint.md" },
    { "Tests" = "tests.md" },
  ]},
  { "Reference" = [
    { "CLI" = "cli.md" },
    { "Queries" = "queries.md" },
    { "Projection Model" = "cypher-model.md" },
    { "Lint Rules" = "lint-rules.md" },
    { "Glossary" = "glossary.md" },
  ]},
  { "Contributing" = [
    { "Overview" = "contrib/index.md" },
    { "Package Architecture" = "contrib/package.md" },
  ]},
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
base_path = "."
[project.markdown_extensions.pymdownx.superfences]
[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
