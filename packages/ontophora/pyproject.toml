[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ontophora"
version = "2026.7.0"
description = "Typed Pydantic models for OWL 2 ontology constructs"
readme = "README.md"
authors = [{ name = "Elliott Wise", email = "ell.wise@gmail.com" }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["owl", "owl2", "ontology", "pydantic", "semantic-web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "language-tags",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/wise-ideas/ontotheke/tree/main/packages/ontophora"
Documentation = "https://wise-ideas.github.io/ontotheke/ontophora/"
Source = "https://github.com/wise-ideas/ontotheke/tree/main/packages/ontophora"
Issues = "https://github.com/wise-ideas/ontotheke/issues"
Changelog = "https://github.com/wise-ideas/ontotheke/releases?q=ontophora"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ontophora*"]

[tool.setuptools.package-data]
"ontophora" = ["py.typed"]

[tool.ty.environment]
root = [
    "./src",
]

[tool.ty.src]
include = [
    "src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=prepend"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
