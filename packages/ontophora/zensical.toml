[project]
site_name = "Ontophora"
site_description = "Typed Pydantic models for OWL 2 ontology constructs"
site_url = "https://wise-ideas.github.io/ontotheke/ontophora/"
repo_url = "https://github.com/wise-ideas/ontotheke/tree/main/packages/ontophora"
docs_dir = "docs"

nav = [
  { "Getting Started" = [
    { "Introduction" = "index.md" },
    { "Build an ontology package" = "tutorials/first-package.md" },
  ]},
  { "How-to Guides" = [
    { "Read and write JSON" = "how-to/json.md" },
    { "Inspect the supported model" = "how-to/inspect-model.md" },
  ]},
  { "Explanation" = [
    { "The model" = "explanation/model.md" },
  ]},
  { "Reference" = [
    { "Public API" = "reference/api.md" },
    { "Construct catalog" = "reference/constructs.md" },
    { "JSON package format" = "reference/json-format.md" },
  ]},
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
